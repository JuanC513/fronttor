<div class="auth-card status-card">
  @if (errorMessage(); as error) {
    <i class="pi pi-exclamation-triangle error-icon" aria-hidden="true"></i>
    <h1>No se pudo iniciar sesión</h1>
    <p>{{ error }}</p>
    <p-button label="Volver a iniciar sesión" routerLink="/login" />
  } @else {
    <p-progressspinner strokeWidth="4" [style]="{ width: '3rem', height: '3rem' }" />
    <h1>Iniciando sesión…</h1>
    <p>Estamos verificando tu cuenta, esto toma solo un momento.</p>
  }
</div>

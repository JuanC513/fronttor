<p-dialog
  header="Recuperar contraseña"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '28rem' }"
  [draggable]="false"
  (onHide)="onHide()"
>
  @if (emailSent()) {
    <div class="sent">
      <i class="pi pi-send" aria-hidden="true"></i>
      <p>
        Si el correo está registrado, recibirás un enlace para crear una contraseña nueva. Revisa
        también la carpeta de spam.
      </p>
      <p-button label="Entendido" styleClass="w-full" (onClick)="visible.set(false)" />
    </div>
  } @else {
    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-4">
      <p class="hint">
        Ingresa el correo de tu cuenta y te enviaremos un enlace para restablecer tu contraseña.
      </p>

      @if (serverError(); as error) {
        <p-message severity="error" [text]="error" styleClass="w-full" />
      }

      <div class="field">
        <label for="forgot-email">Correo electrónico</label>
        <p-iconfield class="w-full">
          <p-inputicon class="pi pi-envelope" />
          <input
            pInputText
            id="forgot-email"
            type="email"
            class="w-full"
            autocomplete="email"
            placeholder="tucorreo@ejemplo.com"
            [attr.maxlength]="maxEmailLength"
            formControlName="email"
          />
        </p-iconfield>
        <app-field-error
          [control]="forgotForm.controls.email"
          [customMessages]="{ required: 'Ingresa tu correo electrónico.' }"
        />
      </div>

      <div class="flex justify-content-end gap-2">
        <p-button
          label="Cancelar"
          variant="outlined"
          severity="danger"
          type="button"
          (onClick)="visible.set(false)"
        />
        <p-button type="submit" label="Enviar enlace" [loading]="loading()" />
      </div>
    </form>
  }
</p-dialog>

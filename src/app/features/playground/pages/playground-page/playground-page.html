<div>
  <button (click)="toggleMode()">Modo: {{ getExecutionMode() }}</button>
  @if (getExecutionMode() === 'manual') {
    <button (click)="run()">Run</button>
  }
</div>

<div class="playground-content">
  <app-code-editor></app-code-editor>
  <div>
    <app-preview-panel></app-preview-panel>
    <app-console-panel></app-console-panel>
  </div>
</div>

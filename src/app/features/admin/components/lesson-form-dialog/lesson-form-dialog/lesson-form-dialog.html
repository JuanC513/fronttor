<p-dialog
  [header]="isEditForm ? 'Editar subtema' : 'Crear subtema'"
  [modal]="true"
  [visible]="true"
  [style]="{ width: '30rem' }"
  (onHide)="closeDialog()"
>
  <span class="flex flex-column gap-5">
    <span class="p-text-secondary block">{{
      isEditForm ? 'Edita el subtema seleccionado' : 'Crea un nuevo subtema'
    }}</span>
    <form [formGroup]="lessonForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-5">
      <p-floatlabel variant="on">
        <p-select
          id="moduleList"
          class="w-full"
          appendTo="body"
          [options]="modulesList()"
          optionLabel="name"
          [filter]="true"
          [checkmark]="true"
          [showClear]="true"
          formControlName="module_id"
        />
        <label for="on_label">Selecciona un tema</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input
          pInputText
          id="submodulename"
          class="flex-auto w-full"
          autocomplete="off"
          formControlName="name"
        />
        <label for="on_label">Nombre</label>
      </p-floatlabel>
      <div class="flex justify-content-end gap-2">
        <p-button label="Cancelar" variant="outlined" (click)="closeDialog()" />
        <p-button
          [label]="isEditForm ? 'Actualizar' : 'Crear'"
          type="submit"
          [disabled]="lessonForm.invalid"
        />
      </div>
    </form>
  </span>
</p-dialog>

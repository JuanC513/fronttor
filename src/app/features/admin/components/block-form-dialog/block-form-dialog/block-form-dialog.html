<p-confirmpopup />

<p-dialog
  [header]="isEditForm ? 'Editar bloque' : 'Crear bloque'"
  [modal]="true"
  [visible]="true"
  [style]="{ width: '80rem' }"
  (onHide)="closeDialog()"
>
  <span class="flex flex-column gap-5">
    <form [formGroup]="blockForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-5 mt-2">
      <span class="flex gap-3">
        <div class="w-full">
          <p-floatlabel variant="on" [formGroup]="uiForm" class="w-full">
            <p-select
              id="moduleList"
              class="w-full"
              appendTo="body"
              [options]="modulesList()"
              optionLabel="name"
              optionValue="id"
              [filter]="true"
              [checkmark]="true"
              [showClear]="true"
              formControlName="module_id"
            />
            <label for="on_label">Selecciona un tema</label>
          </p-floatlabel>
          <app-field-error
            [control]="uiForm.controls['module_id']"
            [customMessages]="{ required: 'Selecciona un tema.' }"
          />
        </div>
        <div class="w-full">
          <p-floatlabel variant="on" class="w-full">
            <p-select
              id="lessonList"
              class="w-full"
              appendTo="body"
              [options]="lessonsList()"
              optionLabel="name"
              optionValue="id"
              [filter]="true"
              [checkmark]="true"
              [showClear]="true"
              formControlName="lesson_id"
            />
            <label for="on_label">Selecciona un subtema</label>
          </p-floatlabel>
          <app-field-error
            [control]="blockForm.controls['lesson_id']"
            [customMessages]="{ required: 'Selecciona un subtema.' }"
          />
        </div>
        <div class="w-full">
          <p-floatlabel variant="on" class="w-full">
            <input
              pInputText
              id="blockname"
              class="flex-auto w-full"
              autocomplete="off"
              formControlName="name"
            />
            <label for="on_label">Nombre</label>
          </p-floatlabel>
          <app-field-error
            [control]="blockForm.controls['name']"
            [customMessages]="{ required: 'Ingresa un nombre para el bloque.' }"
          />
        </div>
      </span>
      <span class="flex flex-column">
        <span class="flex align-items-center gap-2">
          <h5>Escribe el contenido del bloque y visualiza su resultado.</h5>
          <app-markdown-cheatsheet />
          <p-button
            [label]="showAiPanel() ? 'Ocultar asistente' : 'Generar con IA'"
            icon="pi pi-sparkles"
            severity="secondary"
            variant="outlined"
            size="small"
            (onClick)="toggleAiPanel()"
          />
        </span>

        @if (showAiPanel()) {
          <div class="ai-panel flex flex-column gap-3 p-3 mb-3">
            <div [formGroup]="uiForm" class="w-full">
              <p-floatlabel variant="on" class="w-full">
                <textarea
                  pTextarea
                  id="aiInstruction"
                  rows="2"
                  style="resize: none"
                  class="w-full"
                  formControlName="instruccion"
                ></textarea>
                <label for="aiInstruction">¿Qué quieres que cubra este bloque? (opcional)</label>
              </p-floatlabel>
            </div>

            <span class="flex align-items-center gap-3">
              <p-button
                label="Generar contenido"
                icon="pi pi-sparkles"
                [loading]="isGenerating()"
                [disabled]="!canGenerate"
                (onClick)="onGenerateClick($event)"
              />
              <small class="ai-panel__hint">
                Se tienen en cuenta el tema, el subtema y los demás bloques del subtema. Puede
                tardar unos segundos.
              </small>
            </span>

            @if (!canGenerate) {
              <p-message
                severity="info"
                text="Selecciona un tema y un subtema, y escribe el nombre del bloque para poder generar."
                styleClass="w-full"
              />
            }
            @if (generationError()) {
              <p-message severity="error" [text]="generationError()!" styleClass="w-full" />
            }
          </div>
        }
        <span class="flex gap-1 w-full">
          <div class="w-6">
            <p-floatlabel variant="on" class="w-full h-full">
              <textarea
                pTextarea
                id="on_label"
                rows="5"
                cols="30"
                style="resize: none"
                class="h-full w-full"
                formControlName="content"
              ></textarea>
              <label for="on_label">Contenido</label>
            </p-floatlabel>
            <app-field-error
              [control]="blockForm.controls['content']"
              [customMessages]="{ required: 'Escribe el contenido del bloque.' }"
            />
          </div>
          <div class="markdown-rendered w-6 p-4">
            <app-markdown-renderer [content]="blockForm.get('content')?.value || ''" />
          </div>
        </span>
      </span>
    </form>
  </span>
  <ng-template #footer class="pt-2">
    <p-button label="Cancelar" variant="outlined" severity="danger" (click)="closeDialog()" />
    <p-button
      [label]="isEditForm ? 'Actualizar' : 'Crear'"
      (onClick)="onSubmit()"
      [disabled]="blockForm.invalid"
    />
  </ng-template>
</p-dialog>

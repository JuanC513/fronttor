<p-confirmpopup />

<p-dialog
  [header]="isEditForm ? 'Editar tema' : 'Crear tema'"
  [modal]="true"
  [visible]="true"
  [style]="{ width: '25rem' }"
  (onHide)="closeDialog()"
>
  <form [formGroup]="moduleForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-4 pt-2">
    <div>
      <p-floatlabel variant="on">
        <input
          pInputText
          id="modulename"
          class="flex-auto w-full"
          autocomplete="off"
          maxlength="100"
          formControlName="nombre"
        />
        <label for="modulename">Nombre</label>
      </p-floatlabel>
      <app-field-error
        [control]="moduleForm.controls['nombre']"
        [customMessages]="{ required: 'Ingresa un nombre para el tema.' }"
      />
    </div>
    <app-publication-field
      [control]="isPublishedControl"
      [isEditForm]="isEditForm"
      [impact]="impact()"
      [highlight]="isConfirming()"
      entityLabel="el tema"
    />
    <div class="flex justify-content-end gap-2">
      <p-button
        label="Cancelar"
        variant="outlined"
        severity="danger"
        [disabled]="isConfirming()"
        (click)="closeDialog()"
      />
      <span #saveAnchor>
        <p-button
          [label]="isEditForm ? 'Actualizar' : 'Crear'"
          type="submit"
          [disabled]="moduleForm.invalid || isConfirming()"
        />
      </span>
    </div>
  </form>
</p-dialog>

<p-dialog
  [header]="isEditForm ? 'Editar tema' : 'Crear tema'"
  [modal]="true"
  [visible]="true"
  [style]="{ width: '25rem' }"
  (onHide)="closeDialog()"
>
  <span class="p-text-secondary block mb-6">{{
    isEditForm ? 'Edita el tema seleccionado' : 'Crea un nuevo tema'
  }}</span>
  <form [formGroup]="moduleForm" (ngSubmit)="onSubmit()">
    <div class="flex align-items-center gap-4 mb-4">
      <label for="modulename" class="font-semibold w-3">Nombre</label>
      <input
        pInputText
        id="modulename"
        class="flex-auto"
        autocomplete="off"
        formControlName="nombre"
      />
    </div>
    <div class="flex justify-content-end gap-2">
      <p-button label="Cancelar" variant="outlined" (click)="closeDialog()" />
      <p-button
        [label]="isEditForm ? 'Actualizar' : 'Crear'"
        type="submit"
        [disabled]="moduleForm.invalid"
      />
    </div>
  </form>
</p-dialog>

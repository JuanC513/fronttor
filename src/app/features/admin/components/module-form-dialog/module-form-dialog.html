<p-dialog
  header="Crear tema"
  [modal]="true"
  [visible]="true"
  [style]="{ width: '25rem' }"
  (onHide)="closeDialog()"
>
  <span class="p-text-secondary block mb-6">Crea un nuevo tema.</span>
  <div class="flex align-items-center gap-4 mb-4">
    <label for="modulename" class="font-semibold w-3">Nombre</label>
    <input pInputText id="modulename" class="flex-auto" autocomplete="off" />
  </div>
  <div class="flex justify-content-end gap-2">
    <p-button label="Cancelar" severity="secondary" (click)="closeDialog()" />
    <p-button label="Crear" (click)="closeDialog()" />
  </div>
</p-dialog>

<p-dialog
  [header]="isEditForm ? 'Editar tema' : 'Crear tema'"
  [modal]="true"
  [visible]="true"
  [style]="{ width: '25rem' }"
  (onHide)="closeDialog()"
>
  <span class="p-text-secondary block mb-6">{{
    isEditForm ? 'Edita el tema seleccionado' : 'Crea un nuevo tema'
  }}</span>
  <form [formGroup]="moduleForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-5">
    <div>
      <p-floatlabel variant="on">
        <input
          pInputText
          id="modulename"
          class="flex-auto w-full"
          autocomplete="off"
          maxlength="100"
          formControlName="nombre"
        />
        <label for="modulename">Nombre</label>
      </p-floatlabel>
      <app-field-error
        [control]="moduleForm.controls['nombre']"
        [customMessages]="{ required: 'Ingresa un nombre para el tema.' }"
      />
    </div>
    <div class="flex justify-content-end gap-2">
      <p-button label="Cancelar" variant="outlined" severity="danger" (click)="closeDialog()" />
      <p-button
        [label]="isEditForm ? 'Actualizar' : 'Crear'"
        type="submit"
        [disabled]="moduleForm.invalid"
      />
    </div>
  </form>
</p-dialog>

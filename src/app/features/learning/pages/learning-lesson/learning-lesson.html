<section class="learning-lesson-container">
  <div class="header">
    <h1>{{ currentLesson()?.name }}</h1>
    <p-tag severity="secondary" [value]="`Tema: ${currentModule()?.name}`" />
  </div>
  <div class="tabs">
    <p-tabs [(value)]="activeTab" scrollable>
      <p-tablist>
        @for (tab of currentBlocks(); track $index) {
          <p-tab [value]="$index">{{ tab.name }}</p-tab>
        }
      </p-tablist>
    </p-tabs>
  </div>
  <app-custom-scroll-panel class="content">
    <app-markdown-renderer [content]="currentBlocks()?.[activeTab]?.content ?? ''" />
  </app-custom-scroll-panel>
  <div class="footer flex justify-content-between p-3">
    <p-button
      label="Regresar"
      variant="outlined"
      severity="secondary"
      link
      routerLink="/learning"
    />
    <p-button label="Ejercicios" variant="outlined" severity="help" link routerLink="/exercises" />
  </div>
</section>

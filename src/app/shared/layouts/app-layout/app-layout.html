<!-- Igual que el panel de arriba: una sola vez para toda la aplicación, y FUERA del
    `router-outlet`. Los diálogos del profesor se destruyen al guardar, así que un toast dentro de
    uno moriría en el mismo instante en que se emite el mensaje.

    Arriba al centro y no en la esquina, que es el valor por defecto: a la derecha están el botón
    «Tutor IA» del topbar y el cajón del chat, que ocupa toda la altura. Medido, el aviso tapaba el
    botón justo los segundos en que el estudiante puede querer pulsarlo. -->
<p-toast position="bottom-right" />

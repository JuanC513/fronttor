<nav class="sidebar h-full flex" style="position: relative">
  <span class="flex flex-column justify-content-between">
    <span class="flex flex-column" [ngClass]="popupMenuMode() ? 'gap-2' : 'gap-8'">
      @if (popupMenuMode()) {
        <h1>F</h1>
      } @else {
        <span class="px-4">
          <h1 class="title-color">FronTTor</h1>
          <p>Mastering the web</p>
        </span>
      }
      <div class="px-3">
        <p-menu #menu [model]="mainItems" [popup]="popupMenuMode()" />
        @if (popupMenuMode()) {
          <p-button (click)="menu.toggle($event)" icon="pi pi-ellipsis-v" severity="secondary" />
        }
      </div>
    </span>

    <span class="w-100">
      <p-divider />
      <div class="w-100 px-3 pb-2">
        <p-menu #menu [model]="aditionalItems" [popup]="popupMenuMode()" />
      </div>
    </span>
  </span>
  <p-divider class="sidebar-divider" layout="vertical" />
  <p-button
    [style]="{
      position: 'absolute',
      right: '0',
      top: '90%',
      transform: 'translate(50%, -50%)',
      zIndex: '10',
    }"
    [icon]="popupMenuMode() ? 'pi pi-chevron-right' : 'pi pi-chevron-left'"
    [rounded]="true"
    severity="contrast"
    size="small"
    (onClick)="switchSidebarMode()"
  />
</nav>

<nav
  class="sidebar h-full flex"
  [class.sidebar-collapsed]="popupMenuMode()"
  style="position: relative"
>
  <span class="flex flex-column justify-content-between">
    <span class="flex flex-column" [ngClass]="popupMenuMode() ? 'gap-2' : 'gap-8'">
      <span class="flex">
        @if (popupMenuMode()) {
          <h1 class="pl-4">F</h1>
        } @else {
          <span class="px-4">
            <h1 class="title-color">FronTTor</h1>
            <p>Mastering the web</p>
          </span>
        }
        <p-button
          class="mt-4"
          [icon]="popupMenuMode() ? 'pi pi-angle-double-right' : 'pi pi-angle-double-left'"
          link
          size="small"
          (onClick)="switchSidebarMode()"
        />
      </span>
      <div class="px-3 menu-container">
        <p-menu #menu [model]="mainItems()" />
      </div>
    </span>

    <span class="w-100">
      <p-divider />
      <div class="w-100 px-3 pb-2 menu-container">
        <p-menu #menu [model]="aditionalItems()" />
      </div>
    </span>
  </span>
  <p-divider class="sidebar-divider" layout="vertical" />
</nav>

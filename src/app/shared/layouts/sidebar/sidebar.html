<nav class="h-full flex" style="position: relative">
  <span class="p-4 flex flex-column align-items-center justify-content-between">
    <span
      class="flex flex-column align-items-center"
      [ngClass]="popupMenuMode() ? 'gap-2' : 'gap-8'"
    >
      @if (popupMenuMode()) {
        <h1>F</h1>
      } @else {
        <h1>FronTTor</h1>
      }
      <p-menu #menu [model]="items" [popup]="popupMenuMode()" />
      @if (popupMenuMode()) {
        <p-button (click)="menu.toggle($event)" icon="pi pi-ellipsis-v" severity="secondary" />
      }
    </span>

    <p-button
      icon="pi pi-user"
      [rounded]="true"
      [outlined]="true"
      severity="info"
      routerLink="/profile"
    />
  </span>
  <p-divider class="sidebar-divider" layout="vertical" />
  <p-button
    [style]="{
      position: 'absolute',
      right: '0',
      top: '90%',
      transform: 'translate(50%, -50%)',
      zIndex: '10',
    }"
    [icon]="popupMenuMode() ? 'pi pi-chevron-right' : 'pi pi-chevron-left'"
    [rounded]="true"
    severity="secondary"
    size="small"
    (onClick)="switchSidebarMode()"
  />
</nav>

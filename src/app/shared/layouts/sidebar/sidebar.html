<nav
  class="sidebar h-full flex"
  [class.sidebar-collapsed]="popupMenuMode()"
  style="position: relative"
>
  <span class="flex flex-column justify-content-between">
    <span class="flex flex-column" [ngClass]="popupMenuMode() ? 'gap-4' : 'gap-8'">
      <div class="sidebar-logo-row">
        @if (popupMenuMode()) {
          <span class="text-center pt-3">
            <ng-container *ngTemplateOutlet="toggleBtn" />
            <h1 class="title-color logo-mark">F</h1>
          </span>
        } @else {
          <span class="px-3">
            <span class="flex align-items-center gap-2">
              <h1 class="title-color">FronTTor</h1>
              <ng-container *ngTemplateOutlet="toggleBtn" />
            </span>
            <p class="slogan m-0">Mastering the web</p>
          </span>
        }
      </div>

      <div class="px-3 menu-container">
        <p-menu #menu [model]="mainItems()" />
      </div>
    </span>

    <span class="w-100">
      <p-divider />
      <div class="w-100 px-3 pb-2 menu-container">
        <p-menu #menu [model]="aditionalItems()" />
      </div>
    </span>
  </span>
  <p-divider class="sidebar-divider" layout="vertical" />
</nav>

<ng-template #toggleBtn>
  <button
    type="button"
    class="sidebar-toggle-btn"
    [attr.aria-label]="popupMenuMode() ? 'Expandir menú' : 'Colapsar menú'"
    (click)="switchSidebarMode()"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="3" y="3" width="18" height="18" rx="2" />
      <line x1="9" y1="3" x2="9" y2="21" />
    </svg>
  </button>
</ng-template>

<div class="code-editor-container">
  <div class="tabs">
    @for (language of languages; track language) {
      <button type="button" [class.active]="activeTab() === language" (click)="changeTab(language)">
        {{ label(language) }}
      </button>
    }
  </div>
  <div #editorContainer class="editor"></div>
</div>
